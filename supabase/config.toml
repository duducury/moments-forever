# Moments Forever — Supabase local project config (minimal).
# Stage 1 persistence only. Do not enable storage/NFC/map extras here.

project_id = "moments-forever"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = true

[studio]
enabled = true
port = 54323
