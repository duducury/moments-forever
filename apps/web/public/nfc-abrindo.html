<head>
<meta charset="utf-8">

<title>Moments Forever</title>
<!--
  What /n/<token> serves to a browser (see rewrites() in next.config.ts).

  A tag tap used to wait on two cold server functions before the first byte, so
  the phone showed a blank white page for seconds. This page is a plain static
  file: the CDN answers it at once, it looks like the app's own boot splash
  (components/app-boot-splash.tsx, same colours), and only then resolves the tag
  through /api/nfc-link and moves on. The next page's loading.tsx shows the same
  splash, so the person sees one continuous "Abrindo…" until the trip appears.
  Everything is inline on purpose: no extra request before the first paint.
-->
<style>
html,body{margin:0;min-height:100%;background:#121110;color:#f3efe8;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.splash{display:grid;place-items:center;min-height:100vh;min-height:100dvh;box-sizing:border-box;padding:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px));background:radial-gradient(90% 60% at 50% 18%,rgb(208 138 110/18%),transparent 58%),#121110;text-align:center}
.stage{display:grid;justify-items:center;gap:18px;width:min(100%,320px)}
.mark{width:88px;height:88px;border-radius:22px;object-fit:cover;box-shadow:0 18px 40px rgb(0 0 0/40%)}
.wordmark{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:1.45rem;font-weight:500;letter-spacing:-.03em}
.slogan{margin:0;color:#a8a29a;font-size:.98rem;line-height:1.45}
.hint{margin:8px 0 0;color:#d08a6e;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pulse{width:10px;height:10px;margin-top:6px;border-radius:999px;background:#d08a6e;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.retry{margin-top:6px;padding:10px 20px;border:1px solid #d08a6e;border-radius:999px;background:transparent;color:#f3efe8;font:inherit;font-size:.95rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.8}}
</style>
</head>

<script>
(function () {
  var hint = document.getElementById("hint");
  var pulse = document.getElementById("pulse");
  var retry = document.getElementById("retry");
  var raw = location.pathname.split("/")[2] || "";
  var token;
  try { token = decodeURIComponent(raw); } catch (e) { token = raw; }

  // The slow part is waking the server's functions up, one after the other. Wake

    fetch("/perfil/_/album/_", { mode: "no-cors", credentials: "omit", cache: "no-store" }).catch(function () {});

  function open() {
    hint.textContent = "Abrindo sua viagem…";
    pulse.hidden = false;
    retry.hidden = true;
    fetch("/api/nfc-link?token=" + encodeURIComponent(token), { credentials: "same-origin", cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("status " + response.status);

      .then(function (data) {
        var path = data && data.path;

        if (typeof path !== "string" || path.charAt(0) !== "/" || path.charAt(1) === "/") throw new Error("bad path");

      })
      .catch(fail);
